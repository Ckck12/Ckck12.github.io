<div class="lang-switch">
<div class="lang-switch__group" role="group" aria-label="Language / 언어">
<button type="button" class="lang-switch__btn" data-lang-set="en" lang="en">English</button>
<button type="button" class="lang-switch__btn" data-lang-set="ko" lang="ko">한국어</button>
</div>
<script>
(function () {
  var KEY = "cp-site-lang";
  var root = document.documentElement;
  var saved = "en";
  try { saved = window.localStorage.getItem(KEY) === "ko" ? "ko" : "en"; } catch (e) { saved = "en"; }
  root.setAttribute("data-lang", saved);
  var btns = document.querySelectorAll(".lang-switch__btn");
  Array.prototype.forEach.call(btns, function (b) {
    b.setAttribute("aria-pressed", b.getAttribute("data-lang-set") === saved ? "true" : "false");
    b.addEventListener("click", function () {
      var next = b.getAttribute("data-lang-set") === "ko" ? "ko" : "en";
      root.setAttribute("data-lang", next);
      Array.prototype.forEach.call(btns, function (o) {
        o.setAttribute("aria-pressed", o.getAttribute("data-lang-set") === next ? "true" : "false");
      });
      try { window.localStorage.setItem(KEY, next); } catch (e) { }
    });
  });
})();
</script>
</div>
